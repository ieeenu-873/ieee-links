<title>IEEE CS NU | Links</title>
<style>
  :root {
    --bg1: #061a33;
    --bg2: #0b3a75;
    --card: rgba(255,255,255,0.08);
    --card-hover: rgba(255,255,255,0.16);
    --border: rgba(255,255,255,0.18);
    --text: #f4f8ff;
    --muted: #b9cbe6;
    --accent: #4db3ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background: radial-gradient(circle at 20% 0%, var(--bg2), var(--bg1) 70%) fixed;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .wrap { width: 100%; max-width: 480px; text-align: center; }
  .logo {
    display: block;
    width: 140px; height: 140px; margin: 0 auto 20px;
    border-radius: 28px;
    object-fit: cover;
    box-shadow: 0 8px 30px rgba(0,0,0,0.45);
  }
  h1 { font-size: 22px; line-height: 1.3; margin-bottom: 32px; }
  .tagline { color: var(--muted); font-size: 15px; margin-bottom: 32px; }
  .tagline b { color: var(--accent); font-weight: 600; }
  .links { display: flex; flex-direction: column; gap: 14px; }
  a.link {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--text);
    text-decoration: none;
    font-size: 16px; font-weight: 600;
    backdrop-filter: blur(8px);
    transition: transform .15s ease, background .15s ease;
  }
  a.link:hover, a.link:focus-visible { background: var(--card-hover); transform: translateY(-2px); outline: none; }
  a.link.featured {
    background: linear-gradient(135deg, #1a8cff, #0b5fd6);
    border-color: rgba(255,255,255,0.35);
    box-shadow: 0 6px 22px rgba(26,140,255,0.4);
    padding: 18px;
  }
  a.link.featured:hover, a.link.featured:focus-visible { background: linear-gradient(135deg, #3aa0ff, #1a6ee6); }
  a.link svg { width: 24px; height: 24px; flex-shrink: 0; fill: currentColor; }
  a.link span.label { flex: 1; text-align: left; }
  a.link span.arrow { color: var(--muted); }
  footer { margin-top: 36px; color: var(--muted); font-size: 12px; }
</style>
